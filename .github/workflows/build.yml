name: APK yig'ish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Release APK yig'ish
        env:
          OYNA_STORE_PASSWORD: ${{ secrets.OYNA_STORE_PASSWORD }}
          OYNA_KEY_ALIAS: ${{ secrets.OYNA_KEY_ALIAS }}
          OYNA_KEY_PASSWORD: ${{ secrets.OYNA_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: APK nomini o'zgartirish
        run: cp app/build/outputs/apk/release/app-release.apk Oyna.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Oyna-apk
          path: Oyna.apk

      - name: Release'ga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Oyna v1.0.${{ github.run_number }}
          body: |
            Telefonga o'rnatish uchun pastdagi **Oyna.apk** faylini yuklab oling.
          files: Oyna.apk
          make_latest: true
